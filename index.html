<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Lip Sync</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: monospace;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border: 3px solid black;
            padding: 40px;
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 30px;
            align-items: stretch;
        }

        h1 { grid-column: 1 / -1; }
        .input-section { grid-column: 1; grid-row: 2; }
        .stage {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        h1 {
            text-align: center;
            color: black;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 3px solid black;
            padding-bottom: 15px;
        }
        
        .face-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 250px;
            background: white;
            border: 3px solid black;
            position: relative;
        }
        
        .face {
            position: relative;
            width: 200px;
            height: 200px;
        }
        
        .eye {
            position: absolute;
            width: 30px;
            height: 40px;
            background: black;
            border: 2px solid black;
            border-radius: 50%;
            top: 50px;
        }
        
        .eye-left {
            left: 50px;
        }
        
        .eye-right {
            right: 50px;
        }
        
        .mouth-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .mouth-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid black;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            min-height: 320px;
            flex: 1;
            background: white;
        }
        
        textarea:focus {
            outline: none;
            border: 3px solid black;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: 3px solid black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: black;
            transition: all 0.1s;
        }
        
        button:hover:not(:disabled) {
            background: black;
            color: white;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .note {
            font-size: 12px;
            margin-top: -8px;
        }

        .word {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            min-height: 28px;
        }

        @media (max-width: 760px) {
            body { padding: 10px; align-items: flex-start; }
            .container { padding: 16px; gap: 18px; grid-template-columns: minmax(0, 1fr); }
            .stage, .input-section { grid-column: 1; grid-row: auto; }
            textarea { min-height: 140px; }
            h1 { font-size: 20px; }
            textarea { font-size: 16px; }
            button { padding: 16px 8px; font-size: 16px; }
            .word { font-size: 18px; }
        }

        .status {
            text-align: center;
            font-size: 14px;
            color: black;
            min-height: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Auto Lip Sync</h1>
        
        <div class="stage">
        <div class="face-container">
            <div class="face">
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
                <div class="mouth-container">
                    <img id="mouth" class="mouth-img" src="mouths/0.png" alt="mouth">
                </div>
            </div>
        </div>
        
        <div class="word" id="word"></div>
        </div>

        <div class="input-section">
            <textarea id="textInput" placeholder="Type something for the avatar to say..."></textarea>
            <div class="note">Tip: keep each sentence short (under about 25 words) for clear speech.</div>
            
            <div class="button-group">
                <button id="generateBtn">GENERATE</button>
                <button id="playBtn" disabled>PLAY</button>
            </div>

            <div class="button-group">
                <button id="downloadFaceBtn" disabled>DOWNLOAD FACE</button>
                <button id="downloadMouthBtn" disabled>DOWNLOAD MOUTH (GREENSCREEN)</button>
            </div>
            
            <div class="status" id="status"></div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
